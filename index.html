<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Service Motorsport">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Service Motorsport Admin</title>
<style>
:root{--bg:#0e141a;--panel:#17212b;--panel2:#202d39;--text:#f3f6f8;--muted:#a7b4bf;--accent:#f2a900;--line:#31404d;--green:#55d6a2;--red:#ff7272}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 16px;background:linear-gradient(135deg,#111a22,#253543);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#111;font-weight:900;display:grid;place-items:center;font-size:22px}
h1{font-size:20px;margin:0 0 3px}header p{margin:0;color:var(--muted);font-size:12px}.wrap{padding:16px;max-width:780px;margin:auto}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#111a22;border-top:1px solid var(--line);overflow-x:auto}
nav button{flex:1;min-width:64px;background:transparent;border:0;color:var(--muted);font-size:11px;padding:8px 3px;border-radius:10px}
nav button.active{background:var(--panel2);color:var(--accent)}nav span{display:block;font-size:19px;margin-bottom:3px}
h2{font-size:19px;margin:4px 0 14px}.sub{color:var(--muted);font-size:13px;margin-top:-8px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card,.formbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:23px;margin-top:6px}
button,.btn{border:0;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:650;background:var(--accent);color:#171717;cursor:pointer}
button.secondary,.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.danger{background:#49272c;color:#ffdfe0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#101820;color:var(--text);font:inherit;margin:5px 0 12px}
label{font-size:12px;color:var(--muted);display:block}textarea{min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.itemhead strong{font-size:15px}.meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.money{color:var(--green);font-weight:750;white-space:nowrap}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#293946;color:#dbe6ed;font-size:11px}.pill.warn{background:#4a3720;color:#ffd27a}.pill.done{background:#193f35;color:#a6f0d4}
.empty{text-align:center;padding:28px 15px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.search{margin-bottom:12px}.total{font-size:24px;font-weight:800;color:var(--green)}.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.topline h2{margin-bottom:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding:22px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">SMA</div><div><h1>Service Motorsport Admin</h1><p>Beta 1.3 · Control de taller · MXN · Datos guardados en este dispositivo</p></div></div></header>
<main class="wrap" id="app"></main>
<nav id="nav">
<button data-tab="inicio" class="active"><span>⌂</span>Inicio</button>
<button data-tab="ordenes"><span>🛠</span>Órdenes</button>
<button data-tab="clientes"><span>👤</span>Clientes</button>
<button data-tab="motos"><span>🏍</span>Motos</button>
<button data-tab="inventario"><span>▦</span>Inventario</button>
<button data-tab="llantas"><span>🛞</span>Llantas</button>
<button data-tab="caja"><span>💵</span>Caja</button>
<button data-tab="ajustes"><span>⚙</span>Respaldo</button>
</nav>
<script src="app.js"></script>
</body>
</html>
